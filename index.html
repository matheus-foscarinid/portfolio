    <script type="application/ld+json">

        "@context": "https://schema.org",
        "@type": "Person",

          "https://github.com/matheus-foscarinid",

    <script>
      // set theme before first paint so the loader and app don't flash the wrong palette
      if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    </script>

    <script defer src="https://cloud.umami.is/script.js" data-website-id="2dc7deaa-0212-4fc1-a230-5da2749c68fe"></script>

    <style>
      #app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #faf6ee;
      }
      html[data-theme="dark"] #app-loader { background: #282828; }
      html[data-theme="dark"] { background: #282828; }

      #app-loader .spinner {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 4px solid rgba(214, 93, 14, 0.2);
        border-top-color: #d65d0e;
        animation: app-loader-spin 0.8s linear infinite;
      }
      html[data-theme="dark"] #app-loader .spinner {
        border-color: rgba(211, 134, 155, 0.2);
        border-top-color: #d3869b;
      }

      @keyframes app-loader-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #app-loader .spinner { animation-duration: 2.4s; }
      }
    </style>
  </head>

  <div id="app">
    <div id="app-loader">
      <div class="spinner"></div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</html>
